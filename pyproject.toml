[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "xgic-wagtail-cli"
version = "0.1.0"
description = "XGIC CLI Wagtail module - Wagtail product commands (xgic.cli.wagtail)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "XGIC" }
]
requires-python = ">=3.14"
dependencies = [
    "xgic-cli>=0.2.1",
    "rich>=13.7",
]
keywords = [
    "xgic",
    "cli",
    "wagtail",
    "django",
    "cms",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/xgic/wagtail-cli"
Repository = "https://github.com/xgic/wagtail-cli"
Issues = "https://github.com/xgic/wagtail-cli/issues"
Documentation = "https://github.com/xgic/wagtail-cli#readme"
Changelog = "https://github.com/xgic/wagtail-cli/releases"

[project.entry-points."xgic.cli.commands"]
wagtail = "xgic.cli.wagtail.plugin:register"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
test = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xgic"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["xgic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
